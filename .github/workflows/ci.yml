name: CI / CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Lint / Typecheck / Test / Build / E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Placeholder values: the verification build only needs the variables to exist. Real values come from deploy secrets.
      VITE_FIREBASE_API_KEY: ci-placeholder
      VITE_FIREBASE_AUTH_DOMAIN: ci-placeholder.firebaseapp.com
      VITE_FIREBASE_PROJECT_ID: ci-placeholder
      VITE_FIREBASE_STORAGE_BUCKET: ci-placeholder.appspot.com
      VITE_FIREBASE_MESSAGING_SENDER_ID: '000000000000'
      VITE_FIREBASE_APP_ID: '1:000000000000:web:ci-placeholder'
      VITE_MEASUREMENT_ID: G-CIPLACEHOLDER
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit & component tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: E2E (Playwright against MSW mock API)
        run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
          if-no-files-found: ignore

  deploy:
    name: Deploy to S3 / CloudFront
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://rental.imallenlai.com
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_MEASUREMENT_ID: ${{ secrets.VITE_MEASUREMENT_ID }}
        run: npm run build

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # 舊版（CRA）的 /static/* 不刪除：CloudFront 仍可能快取舊 index.html，需要能載入舊 JS
      - name: Upload hashed assets (immutable)
        env:
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
        run: aws s3 sync dist/assets "s3://$S3_BUCKET/assets" --cache-control "public, max-age=31536000, immutable" --only-show-errors

      - name: Upload other public files
        env:
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
        run: aws s3 sync dist "s3://$S3_BUCKET" --exclude "assets/*" --exclude "index.html" --cache-control "public, max-age=3600" --only-show-errors

      # index.html 最後上傳：確保它引用的 assets 已經存在
      - name: Upload index.html (no-cache)
        env:
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
        run: aws s3 cp dist/index.html "s3://$S3_BUCKET/index.html" --cache-control "no-cache" --content-type "text/html; charset=utf-8" --only-show-errors

      - name: Invalidate CloudFront (optional)
        env:
          DISTRIBUTION_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          if [ -z "$DISTRIBUTION_ID" ]; then
            echo "::notice::CLOUDFRONT_DISTRIBUTION_ID not set; CloudFront will pick up the new index.html when its cached copy expires"
            exit 0
          fi
          aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION_ID" --paths "/index.html" "/" --query 'Invalidation.Id' --output text

      - name: Verify uploaded index.html
        env:
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
        run: |
          aws s3 cp "s3://$S3_BUCKET/index.html" - | diff -q - dist/index.html
          echo "S3 index.html matches this build"
